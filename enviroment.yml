name: sdsp_pipeline
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python
  - python=3.9

  # Core libraries
  - numpy
  - pandas
  - scipy
  - scikit-learn

  # Bioinformatics
  - biopython
  - viennarna
  - mafft
  - clustalw

  # Optional (je nach Pipeline)
  - hmmer

  # Plotting (falls du Graphen machst)
  - matplotlib
  - seaborn
  - openpyxl

  # Utilities
  - pip